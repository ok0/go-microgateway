apiVersion: v1
kind: Service
metadata:
  name: {{ include "microgateway.fullname" . }}
  labels:
    {{- include "microgateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "microgateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP