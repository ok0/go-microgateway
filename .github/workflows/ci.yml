name: ci

on: [push, pull_request]

env:
  GO_VERSION: "1.27.3"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: redis
        env:
          GOWORK: ${{ github.workspace }}/go.work

  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.0", "stable"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build redis module
        run: go build ./...
        working-directory: redis
        env:
          GOWORK: ${{ github.workspace }}/go.work
      - name: vet redis module
        run: go vet ./...
        working-directory: redis
        env:
          GOWORK: ${{ github.workspace }}/go.work
      - name: test redis module
        run: go test -race ./...
        working-directory: redis
        env:
          GOWORK: ${{ github.workspace }}/go.work

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: runner
        run: getconf _NPROCESSORS_ONLN
      - name: cover
        run: make cover-ci
      - name: redis test times
        if: always()
        run: make cover-times

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make tidy-check

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["redis:6.2", "redis:7.4"]
    services:
      redis:
        image: ${{ matrix.redis }}
        ports: ["6379:6379"]
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-retries 10"
    env:
      MICROGATEWAY_HEAVY: "1"
      MICROGATEWAY_REDIS_ADDR: "localhost:6379"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make integration

  realnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make realnet

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make docker
      - name: image user
        run: |
          id=$(docker create microgateway:dev)
          docker cp "$id:/etc/passwd" "$RUNNER_TEMP/passwd"
          docker rm "$id"
          grep '^nonroot:x:65532:65532:' "$RUNNER_TEMP/passwd"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make workflow-lint

  k8s:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: keep Helm 3
        run: cp "$(command -v helm)" "$RUNNER_TEMP/helm3"
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: make k8s-check
        env:
          HELM3: ${{ runner.temp }}/helm3
          KUBECONFORM: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
