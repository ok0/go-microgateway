version: 1
listeners:
  - name: public
    address: ":8080"
    bogus_key: true
upstreams:
  - name: users
    hosts:
      - url: "http://127.0.0.1:9001"
  - name: users
    hosts:
      - url: "http://127.0.0.1:9002"
routes:
  - name: a
    match:
      path: /api
    upstream: missing
  - name: b
    match:
      path: /users/:id/*rest/x
      path_type: pattern
    upstream: users
    timeout: fast
